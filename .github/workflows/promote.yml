name: Promote version to stream

on:
  workflow_dispatch:
    inputs:
      stream:
        description: "Release stream to promote to (dev, stage, prod, demo)"
        required: true
        type: string
      version:
        description: "Version to promote (e.g. 0.17.49)"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update streams.json
        env:
          STREAM: ${{ inputs.stream }}
          VERSION: ${{ inputs.version }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg stream "$STREAM" \
             --arg version "$VERSION" \
             --arg now "$NOW" \
             '.streams[$stream] = $version | .updated_at = $now' \
             streams.json > streams.json.tmp
          mv streams.json.tmp streams.json

      - name: Commit and push
        env:
          STREAM: ${{ inputs.stream }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git commit -m "promote $VERSION to $STREAM"
          git push
